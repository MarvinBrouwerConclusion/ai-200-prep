  cursor: not-allowed;

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */

   * @param {string} property

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      typeof nextState !== &quot;object&quot; ||

      nextState,

          typeof value === &quot;function&quot; ||

      typeof parsedState !== &quot;object&quot; ||

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,

      sendFollowUpMessage,

        detail: { globals: globalThis.openai },

    postToHost(&quot;height&quot;, {
      height: Math.ceil(

          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);

        return;
      }
      hostPort = nextHostPort;

      return;
    }

        id = decodeURIComponent(href.slice(1));

  q(&quot;MS001&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A custom Linux container listens on port 8000 in an App Service app that is not sidecar-enabled. Which app setting configures HTTP forwarding to that port?&quot;,[&quot;Set the `WEBSITES_PORT` app setting to 8000.&quot;,&quot;Modify the Dockerfile to use EXPOSE 80.&quot;,&quot;Enable the HTTP/2 protocol in the platform settings.&quot;],0,&quot;WEBSITES_PORT=8000 configures forwarding for non-sidecar custom containers. This setting does not apply to sidecar-enabled apps, which configure the main container target port through sitecontainers.&quot;,&quot;https://learn.microsoft.com/en-us/azure/app-service/configure-sidecar&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS002&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A document processing application writes output files during processing. After a container restart, the output files are missing. How do you configure App Service to persist these files?&quot;,[&quot;Set `WEBSITES_ENABLE_APP_SERVICE_STORAGE` to true and write files to the `/home` directory.&quot;,&quot;Configure a larger container image with more disk space.&quot;,&quot;Enable always-on to prevent container restarts.&quot;],0,&quot;Correct. This setting enables persistent storage for the /home directory. Files written to /home persist across container restarts and are shared across scaled instances.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,official:true}),
  q(&quot;MS003&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A production application requires different API endpoint URLs for staging and production deployment slots. Which configuration approach ensures the staging URL doesn&#x27;t swap to production during a slot swap?&quot;,[&quot;Configure the API_ENDPOINT setting as a slot setting.&quot;,&quot;Store the API endpoint in the container image for each environment.&quot;,&quot;Use connection strings instead of app settings for the API endpoint.&quot;],0,&quot;Correct. Slot settings remain with their slot during swap operations. Marking API_ENDPOINT as a slot setting ensures each slot maintains its own endpoint configuration.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,official:true}),
  q(&quot;MS004&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A container starts successfully but health checks are failing, and App Service removes instances from the load balancer. The application has a `/healthz` endpoint that returns HTTP 200. What is the most likely cause?&quot;,[&quot;The health check path in App Service is configured differently than the application&#x27;s health endpoint path.&quot;,&quot;Health checks require HTTPS, but the container only serves HTTP.&quot;,&quot;The container needs more memory to handle health check requests.&quot;],0,&quot;Correct. The health check path configured in App Service must match the exact path where your application responds to health requests. A mismatch like /health versus /healthz causes check failures.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,official:true}),
  q(&quot;MS005&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A developer needs to verify that app settings are correctly injected into a running container. Which diagnostic tool provides this information?&quot;,[&quot;The Kudu diagnostic console Environment page.&quot;,&quot;The log stream in the Azure portal.&quot;,&quot;The App Service metrics dashboard.&quot;],0,&quot;Correct. The SCM (Kudu) Environment view (or the /Env endpoint) shows the environment variables that App Service applies to the app, including app settings and system-provided variables.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-app-service/7-module-assessment&quot;,official:true}),
  q(&quot;MS006&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A team runs one compact language model for each instance of an internal API. The model must start, stop, and scale with the API. Low-latency local calls are also important. Which hosting approach best fits these requirements?&quot;,[&quot;Deploy the model as a separate shared service with its own scaling policy.&quot;,&quot;Run the model in an App Service sidecar beside the main API container.&quot;,&quot;Add the model process to the main API container image.&quot;],1,&quot;An App Service sidecar follows the main container&#x27;s lifecycle and adds one model process to every app instance. The containers can communicate over `localhost` without a separate service endpoint.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,official:true}),
  q(&quot;MS007&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A sidecar-enabled app contains an API and a model server. External requests must reach only the API, while the API calls the model server locally. How should the container roles be configured?&quot;,[&quot;Set `isMain: true` on the API and `isMain: false` on the model server.&quot;,&quot;Set `isMain: true` on both containers and assign different target ports.&quot;,&quot;Set `isMain: false` on both containers and configure `WEBSITES_PORT` for the API.&quot;],0,&quot;App Service routes external traffic only to the one container marked as main. The model server remains a sidecar and is available to the API through the shared network namespace.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,official:true}),
  q(&quot;MS008&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A production web app must pull private main and sidecar images from an Azure Container Registry that uses RBAC Registry Permissions. The app can&#x27;t store registry passwords. Which configuration meets the requirement?&quot;,[&quot;Enable the registry admin account and store its credentials in `DOCKER_REGISTRY_SERVER_*` app settings.&quot;,&quot;Make the repositories public and omit authentication from each site container definition.&quot;,&quot;Assign a managed identity to the app, grant it `AcrPull`, and reference the identity in each private site container definition.&quot;],2,&quot;Managed identity lets App Service authenticate without a registry password. For the registry&#x27;s stated permission mode, the identity needs `AcrPull`, and the site container definitions identify the intended authentication type and identity. The registry must also accept ARM-scoped authentication because Web App image pulls rely on ARM-scoped credentials.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,official:true}),
  q(&quot;MS009&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A model sidecar produces artifacts that must remain durable independently of the web app lifecycle and serve as a system of record for other applications. Where should the application store the artifacts?&quot;,[&quot;Store the artifacts under the web app&#x27;s shared `/home` directory.&quot;,&quot;Use Azure Blob Storage or Azure Files as the durable storage boundary.&quot;,&quot;Write the artifacts to each container&#x27;s writable image layer.&quot;],1,&quot;Azure Storage provides a durable boundary outside the sidecar and web app lifecycle. Other authorized applications can access the artifacts independently.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,official:true}),
  q(&quot;MS010&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;The main API receives a connection-refused error when it calls `http://localhost:11434`. Which diagnostic step most directly tests the failing boundary?&quot;,[&quot;Compare the API endpoint port with the sidecar target port, then inspect whether the sidecar process listens on that port.&quot;,&quot;Scale the App Service plan before inspecting the container configuration.&quot;,&quot;Change the API endpoint from `localhost` to the sidecar container name.&quot;],0,&quot;A connection refusal means that no process accepts the local connection at that moment. Comparing the configured ports and checking the sidecar listener directly tests the local connectivity boundary.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-sidecar-azure-app-service/7-knowledge-check&quot;,official:true}),
  q(&quot;MS011&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your team builds container images on developer workstations, leading to inconsistent results. You need to ensure all images are built in a controlled environment. Which Azure Container Registry feature addresses this requirement?&quot;,[&quot;ACR Tasks quick build&quot;,&quot;Geo-replication&quot;,&quot;Repository namespaces&quot;],0,&quot;ACR Tasks quick build offloads image building to Azure, providing a consistent cloud environment that eliminates &#x27;works on my machine&#x27; problems. Quick tasks use the az acr build command to build images in a controlled Azure environment.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,official:true}),
  q(&quot;MS012&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You need to deploy a container image to production and ensure every node in your Kubernetes cluster runs the exact same image version, even if someone pushes a new image with the same tag. How should you reference the image?&quot;,[&quot;By manifest digest&quot;,&quot;By the latest tag&quot;,&quot;By semantic version tag&quot;],0,&quot;Manifest digests are immutable SHA-256 hashes that uniquely identify an image regardless of tags. Pulling by digest guarantees you get the exact image, even if someone pushes a new image with the same tag.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,official:true}),
  q(&quot;MS013&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your AI application depends on a base image containing PyTorch. When the PyTorch team releases security patches to the base image, you want your application image to rebuild automatically. Which ACR Tasks trigger type provides this capability?&quot;,[&quot;Base image update trigger&quot;,&quot;Source code commit trigger&quot;,&quot;Scheduled trigger&quot;],0,&quot;Base image update triggers detect changes to parent images and automatically rebuild dependent images. This capability keeps your application images current with security patches in base images.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,official:true}),
  q(&quot;MS014&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You&#x27;re implementing a tagging strategy for production deployments. Your requirements include traceability to the source code commit and the ability to roll back to any previous version. Which tagging pattern best meets these requirements?&quot;,[&quot;Unique tags with Git commit SHA&quot;,&quot;Stable tags like v1 and v2&quot;,&quot;Using only the latest tag&quot;],0,&quot;A unique Git commit tag provides source traceability and a rollback reference when distinct build tags are retained. Tags remain mutable even when their names contain commit SHAs. Enforce a no-overwrite policy or image locking, and deploy by digest when immutable content is required.&quot;,&quot;https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS015&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You deployed a critical AI inference API to production and need to prevent the container image from being accidentally deleted. Which ACR feature should you use?&quot;,[&quot;Image locking with write-enabled false&quot;,&quot;Repository namespaces&quot;,&quot;Geo-replication&quot;],0,&quot;Setting write-enabled to false locks the image to prevent deletion or modification. Locked images remain available even when retention policies run, ensuring production deployments are protected.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/store-manage-containers-azure-container-registry/6-module-assessment&quot;,official:true}),
  q(&quot;MS016&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You&#x27;re deploying an AI document-processing API that must access a private endpoint and share logs and networking settings across multiple container apps. Which Azure Container Apps resource provides that shared boundary?&quot;,[&quot;A Container Apps environment&quot;,&quot;A Container Apps revision&quot;,&quot;A replica&quot;],0,&quot;A Container Apps environment is the shared boundary that groups container apps for networking and observability integration, which helps you manage shared settings for a solution.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS017&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You want a consistent, source-controlled deployment for a container app so that configuration is reviewed like code. Which approach best supports that goal?&quot;,[&quot;Use `az containerapp create --yaml` and `az containerapp update --yaml` with a YAML file stored in source control&quot;,&quot;Use `az containerapp update --set-env-vars` for all changes without maintaining a configuration file&quot;,&quot;Rely on image tags and redeploy with `az containerapp update --image` to apply environment-specific configuration&quot;],0,&quot;Using YAML definitions lets you store configuration in source control and apply it consistently across environments using CLI commands.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS018&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your container app needs an API key for an embeddings provider. You don&#x27;t want to store the value in a YAML file. Which pattern should you use?&quot;,[&quot;Store the secret in Container Apps secrets and reference it from an environment variable&quot;,&quot;Add the API key as plain text in the YAML file under `env:`&quot;,&quot;Bake the API key into the container image&quot;],0,&quot;This pattern keeps secret values out of source control while still making them available to the running container through a referenced environment variable.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,official:true}),

  q(&quot;MS020&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A container app fails to start after you update the image. You need fast feedback to diagnose the issue. Which command is the best first step?&quot;,[&quot;Run `az containerapp logs show`&quot;,&quot;Run `az containerapp revision list`&quot;,&quot;Run `az containerapp replica list`&quot;],0,&quot;Container logs provide immediate signals such as startup errors, missing environment variables, or authentication failures.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-containers-azure-container-apps/8-module-assessment&quot;,official:true}),

  q(&quot;MS022&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;An application executes untrusted Python that only processes files uploaded by the backend. Which network configuration best limits the risk of data exfiltration?&quot;,[&quot;Set `--network-status EgressEnabled` and restrict access through the backend identity&quot;,&quot;Set `--network-status EgressDisabled` on the session pool&quot;,&quot;Increase `--cooldown-period` so the session retains its files&quot;],1,&quot;Disabled egress prevents generated code from reaching external destinations when the workload only needs supplied code and uploaded files.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,official:true}),
  q(&quot;MS023&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A multitenant backend needs to preserve temporary files across related requests without letting users address another tenant&#x27;s session. How should it manage session identifiers?&quot;,[&quot;Use the user&#x27;s email address as the identifier and include it in client requests&quot;,&quot;Accept an identifier generated by the client and validate only its format&quot;,&quot;Generate an unpredictable identifier on the server and store its user or conversation association in backend state&quot;],2,&quot;A server-generated identifier and server-side ownership mapping let the backend authorize every operation while reusing the correct session.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,official:true}),
  q(&quot;MS024&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;The execution API returns an HTTP success response, but the submitted Python raises an exception. How should the backend classify the outcome?&quot;,[&quot;As an execution failure&quot;,&quot;As a transport failure&quot;,&quot;As a successful result&quot;],0,&quot;The transport completed, but the code didn&#x27;t execute successfully. The backend must inspect the execution result separately from the HTTP status.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,official:true}),
  q(&quot;MS025&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A generated-code execution times out at the backend, and the backend can&#x27;t determine whether the code produced side effects. What is the safest retry policy?&quot;,[&quot;Retry every timeout immediately with the same session identifier&quot;,&quot;Retry only when the operation is idempotent and the backend can evaluate the resulting state&quot;,&quot;Retry only with a new session identifier&quot;],1,&quot;Idempotency and state verification limit the risk of repeating an operation whose original outcome is unknown.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/dynamic-sessions-azure-container-apps/7-knowledge-check&quot;,official:true}),
  q(&quot;MS026&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You deploy a new image to a production container app. Which approach provides the best traceability and reduces the risk of deploying the wrong artifact?&quot;,[&quot;Reference the image by digest (for example, `myregistry.azurecr.io/app@sha256:&lt;digest&gt;`) when you update the container app.&quot;,&quot;Reference the image by the `latest` tag to ensure the platform always pulls the most recent build.&quot;,&quot;Rebuild the image locally on each environment to ensure the image matches the environment.&quot;],0,&quot;Digests identify an immutable image, so the deployment always uses the exact artifact you validated and approved.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS027&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A new revision starts but shouldn&#x27;t receive traffic while you investigate. Which action removes the revision from traffic without deleting it?&quot;,[&quot;Run `az containerapp revision deactivate` for the revision.&quot;,&quot;Run `az containerapp revision delete` for the revision.&quot;,&quot;Run `az containerapp stop` for the container app.&quot;],0,&quot;Deactivating a revision stops it from receiving traffic while keeping it available for inspection and later cleanup.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS028&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A revision fails readiness checks immediately after deployment. Which issue is the most common root cause you should validate first?&quot;,[&quot;The readiness probe targets the wrong port or path for the container&#x27;s HTTP server.&quot;,&quot;The container image is too small to include all required libraries.&quot;,&quot;The container app environment can&#x27;t route traffic to the public internet.&quot;],0,&quot;Probe misconfiguration is a frequent cause of immediate readiness failure, especially during image updates that change ports or routes.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS029&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You suspect only one revision has a runtime exception after an update. What is the most effective first step to confirm the problem?&quot;,[&quot;Stream the container app logs and filter by revision while reproducing the request.&quot;,&quot;Delete older revisions to reduce noise in troubleshooting output.&quot;,&quot;Increase CPU and memory allocations before investigating.&quot;],0,&quot;Logs provide direct evidence of runtime exceptions and help you tie errors to a specific revision and time window.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS030&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your AI API experiences high latency and log messages indicate CPU throttling during peak traffic. Which change most directly addresses the throttling?&quot;,[&quot;Increase the per-replica CPU allocation, and then reassess scaling rules based on throughput.&quot;,&quot;Deactivate the newest revision to reduce load on the system.&quot;,&quot;Switch the image reference from digest to tag.&quot;],0,&quot;CPU throttling indicates the replica doesn&#x27;t have enough CPU for its workload. Increasing CPU per replica is a direct fix, and you can then tune scaling for cost and throughput.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS031&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A developer wants to configure a container app that processes messages from an Azure Service Bus queue and scales to zero replicas when no messages are present. Which scaling configuration meets this requirement?&quot;,[&quot;Set `--min-replicas 0` with an HTTP scale rule&quot;,&quot;Set `--min-replicas 0` with a CPU scale rule&quot;,&quot;Set `--min-replicas 0` with an azure-servicebus scale rule&quot;],2,&quot;The azure-servicebus scale rule monitors queue depth and supports scale-to-zero. When no messages are in the queue, the application can scale to zero replicas. New messages trigger automatic scale-up.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS032&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A development team wants to ensure their container app has five replicas ready before the morning traffic spike at 8 AM, while still allowing scale-to-zero overnight. Which scaling approach meets this requirement?&quot;,[&quot;Configure a cron scale rule combined with an HTTP scale rule&quot;,&quot;Set minimum replicas to five with an HTTP scale rule&quot;,&quot;Configure a CPU scale rule with a low utilization threshold&quot;],0,&quot;Cron scaling activates during specified time windows and requests a fixed number of replicas. Combined with HTTP scaling, the cron rule establishes baseline capacity before expected peak hours while HTTP scaling handles variations. Outside the cron window, the app can scale to zero when no traffic arrives.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS033&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A team is deploying a new version of their container app and wants to send 10% of traffic to the new version for validation before full rollout. What must they configure?&quot;,[&quot;Enable multiple revision mode and configure traffic splitting with revision weights&quot;,&quot;Use single revision mode with zero-downtime deployment&quot;,&quot;Configure a cron scale rule to schedule traffic shifts&quot;],0,&quot;Multiple revision mode allows multiple revisions to be active simultaneously. Traffic splitting with revision weights distributes traffic by percentage, enabling canary deployments where a small percentage of traffic goes to the new version for validation.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS034&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;When configuring KEDA scale rules for Azure services, which authentication method is recommended for production workloads?&quot;,[&quot;Connection strings stored as container app secrets&quot;,&quot;Managed identity with `--scale-rule-identity`&quot;,&quot;Anonymous access without authentication&quot;],1,&quot;Managed identity authentication eliminates the need to store connection strings as secrets. The scaler authenticates directly using the identity, reducing security risks, and simplifying credential management for production deployments.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/scale-containers-azure-container-apps/8-module-assessment&quot;,official:true}),
  q(&quot;MS035&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You need to store a database connection string for your application running on AKS. The connection string contains a password and shouldn&#x27;t be visible in your source code repository. Which Kubernetes resource should you use?&quot;,[&quot;ConfigMap, because it stores configuration data&quot;,&quot;Secret, supplied through a secure deployment process without committing its value&quot;,&quot;PersistentVolumeClaim, because it provides storage for application data&quot;],1,&quot;Use a Secret for sensitive values and supply them securely outside Git. A Secret manifest with a password remains sensitive; base64 encoding is not encryption. RBAC and secret-storage controls are still needed. A Secret alone does not keep credentials out of source control.&quot;,&quot;https://kubernetes.io/docs/concepts/configuration/secret/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS036&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your AI application reads feature flags and service endpoints from environment variables. You want to update these settings without rebuilding your container image. How should you inject these nonsensitive values into your Pods?&quot;,[&quot;Create a ConfigMap with the settings and reference the keys using configMapKeyRef in the Deployment&quot;,&quot;Store the values in a Secret and mount it as a volume&quot;,&quot;Hardcode the values in the Deployment manifest and update the manifest when settings change&quot;],0,&quot;Use configMapKeyRef for nonsensitive environment variables. Changes to a ConfigMap do not update environment variables in running containers: restart or roll out Pods to pick up new values. Rebuilding the image is unnecessary.&quot;,&quot;https://kubernetes.io/docs/concepts/configuration/configmap/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS037&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;An AKS PVC specifies a StorageClass with an available dynamic provisioner and volumeBindingMode: Immediate. No existing PV matches. Assuming quota and provisioning succeed, what normally happens after applying the claim?&quot;,[&quot;You must manually create an Azure Disk in the Azure portal before the PVC can bind&quot;,&quot;AKS uses the specified StorageClass to automatically provision Azure storage that backs the PVC&quot;,&quot;The PVC remains unbound until you create a matching PersistentVolume manifest&quot;],1,&quot;The provisioner creates backing storage and a PV for the claim. With WaitForFirstConsumer, provisioning and binding wait until a Pod using the claim is scheduled. Not every PVC is provisioned immediately when created.&quot;,&quot;https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS038&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Your application needs to access API keys stored in a Kubernetes Secret. You want to make the keys available as environment variables in the container. Which field should you use in the Deployment manifest to reference the Secret?&quot;,[&quot;valueFrom with secretKeyRef&quot;,&quot;Volumes with secret type&quot;,&quot;configMapKeyRef pointing to the Secret name&quot;],0,&quot;The valueFrom field with secretKeyRef is the correct way to inject Secret values as environment variables. This resolves the Secret key at Pod start time.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS039&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You need to decide between mounting a ConfigMap as environment variables or as files. Your application reads a JSON configuration file at startup. Which approach should you choose?&quot;,[&quot;Mount the ConfigMap as environment variables because all applications can read environment variables&quot;,&quot;Mount the ConfigMap as files using a volume so the JSON file appears on disk where the application expects it&quot;,&quot;Store the JSON content in a Secret and use secretKeyRef to inject it as an environment variable&quot;],1,&quot;When an application expects configuration files on disk, mount the ConfigMap as a volume. Each key becomes a file in the mount directory.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/configure-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS040&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Which Service type should you use when you need to expose an application to the internet with an Azure-managed load balancer?&quot;,[&quot;LoadBalancer&quot;,&quot;ClusterIP&quot;,&quot;NodePort&quot;],0,&quot;LoadBalancer creates an external Azure Load Balancer with a public IP address, making your application accessible from the internet.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS041&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;What happens if a Pod&#x27;s resource requests exceed the available capacity on all cluster nodes?&quot;,[&quot;The Pod stays in Pending status until sufficient resources become available&quot;,&quot;Kubernetes automatically scales the cluster to add more nodes&quot;,&quot;The Pod starts but with reduced resource allocation&quot;],0,&quot;When resource requests can&#x27;t be satisfied, Kubernetes can&#x27;t schedule the Pod, so it remains in Pending status until nodes have enough capacity.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS042&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;What must match between a Deployment and a Service for traffic to route correctly?&quot;,[&quot;The Pod labels in the Deployment template must match the Service selector&quot;,&quot;The container port in the Deployment must match the Service port&quot;,&quot;The Deployment name must match the Service name&quot;],0,&quot;The Service uses its selector to find Pods with matching labels. If labels don&#x27;t match, the Service has no endpoints and traffic can&#x27;t route.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS043&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Which kubectl command should you use to view logs from a Pod that crashed and restarted?&quot;,[&quot;`kubectl logs &lt;pod-name&gt; --previous`&quot;,&quot;`kubectl logs &lt;pod-name&gt;`&quot;,&quot;`kubectl describe pod &lt;pod-name&gt;`&quot;],0,&quot;The `--previous` flag shows logs from the previous container instance before it crashed, which is essential for diagnosing CrashLoopBackOff issues.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS044&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;What does the `replicas` field in a Deployment manifest control?&quot;,[&quot;The number of Pod copies that should run simultaneously&quot;,&quot;The number of containers in each Pod&quot;,&quot;The number of Services that can connect to the Deployment&quot;],0,&quot;The `replicas` field determines how many identical Pods Kubernetes maintains. This provides high availability and load distribution.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/deploy-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS045&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You receive reports that an AI inference API on Azure Kubernetes Service occasionally returns HTTP 500 errors and higher latency. You want to inspect recent error messages for a specific pod while reproducing the issue. Which approach is most appropriate?&quot;,[&quot;Use `kubectl logs -f &lt;pod-name&gt; -n &lt;namespace&gt;` while you send test requests to the API.&quot;,&quot;Open Azure Monitor and review only node CPU metrics for the last week.&quot;,&quot;Run `kubectl describe node` on all nodes to look for scheduling events.&quot;],0,&quot;Streaming logs from the specific pod while you reproduce the issue lets you see real-time error messages and stack traces that explain the HTTP 500 errors and latency.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS046&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A pod that runs a model-serving container is stuck in CrashLoopBackOff. You want to understand why the container exits. What should you do first?&quot;,[&quot;Run `kubectl describe pod &lt;pod-name&gt; -n &lt;namespace&gt;` and inspect events and container status.&quot;,&quot;Immediately delete the pod so Kubernetes recreates it.&quot;,&quot;Scale the Deployment to zero replicas and then scale it back up.&quot;],0,&quot;`kubectl describe pod` shows recent events and container status, which usually reveal the exit reason, failed probes, or configuration problems causing CrashLoopBackOff.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS047&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;A Service that fronts your AI API shows no endpoints, even though the pods appear healthy and ready. Which command helps you confirm whether the Service selectors match pod labels?&quot;,[&quot;`kubectl describe service &lt;service-name&gt; -n &lt;namespace&gt;`&quot;,&quot;`kubectl top nodes`&quot;,&quot;`kubectl logs &lt;pod-name&gt; -n &lt;namespace&gt;`&quot;],0,&quot;`kubectl describe service` shows the selector labels and current endpoints, so you can verify whether the Service matches the pods.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS048&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;You need to debug a new AI endpoint inside the cluster before exposing it externally. You want to send HTTP requests from your development machine directly to the Service. Which command should you use?&quot;,[&quot;`kubectl port-forward service/&lt;service-name&gt; 8080:80 -n &lt;namespace&gt;`&quot;,&quot;`kubectl get endpoints &lt;service-name&gt; -n &lt;namespace&gt;`&quot;,&quot;`kubectl describe node` on the node that hosts the pod&quot;],0,&quot;`kubectl port-forward` from your workstation to the Service lets you send HTTP requests directly to the endpoint inside the cluster.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS049&quot;,&quot;containers&quot;,&quot;single&quot;,&quot;Metrics for a model-serving pod show sustained CPU usage at its configured limit, and users report increased latency. What is the most appropriate next step?&quot;,[&quot;Adjust CPU requests and limits or scale out replicas so the pod has enough capacity.&quot;,&quot;Ignore the metrics because the pod is still running.&quot;,&quot;Delete the Service and recreate it with the same configuration.&quot;],0,&quot;When a pod consistently hits its CPU limit and latency increases, you typically need to raise CPU resources or add replicas so the workload has more capacity.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/monitor-apps-azure-kubernetes-service/6-module-assessment&quot;,official:true}),
  q(&quot;MS050&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A developer is designing a container for an AI application that stores user interaction logs. Each document includes a userId property. The application frequently retrieves all logs for a specific user. Which partition key selection provides the best performance for this access pattern?&quot;,[&quot;Use userId as the partition key&quot;,&quot;Use a timestamp property as the partition key&quot;,&quot;Use a boolean isProcessed property as the partition key&quot;],0,&quot;Using userId as the partition key groups all documents for a single user together in the same logical partition. This enables single-partition queries when filtering by user, providing the lowest latency and RU cost for the application&#x27;s primary access pattern.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,official:true}),
  q(&quot;MS051&quot;,&quot;data&quot;,&quot;single&quot;,&quot;An AI application caches model inference results in Azure Cosmos DB. The application periodically recomputes results and needs to store them regardless of whether a cached entry already exists. Which SDK method handles this requirement most effectively?&quot;,[&quot;Use create_item() to insert the item&quot;,&quot;Use replace_item() to update the item&quot;,&quot;Use upsert_item() to insert or replace the item&quot;],2,&quot;The upsert_item() method inserts a new item if it doesn&#x27;t exist or replaces the existing item with the same ID and partition key. This simplifies update logic when you don&#x27;t need to know whether the item existed previously, making it ideal for caching scenarios where results are periodically recomputed.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,official:true}),
  q(&quot;MS052&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A Cosmos DB container uses category as its partition key. A recommendation has a known item ID and category value. Which SDK method retrieves it most efficiently?&quot;,[&quot;Use query_items() with a WHERE clause filtering by ID&quot;,&quot;Use read_item() with the item ID and partition key&quot;,&quot;Use query_items() with enable_cross_partition_query=True&quot;],1,&quot;Point reads using read_item() retrieve a single item by ID and partition key with the lowest possible latency and RU cost (approximately 1 RU for a 1-KB item). This is the most efficient method when you know both values.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS053&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A developer is building a search feature that accepts user-provided filter values. The feature filters products by category and maximum price. What is the primary reason to use parameterized queries instead of string concatenation?&quot;,[&quot;Parameterized queries prevent injection attacks and enable query plan caching&quot;,&quot;Parameterized queries automatically convert data types&quot;,&quot;Parameterized queries run faster than queries with literal values&quot;],0,&quot;Parameters separate query structure from values, preventing malicious input from modifying query logic. Additionally, Azure Cosmos DB can cache and reuse execution plans for parameterized queries, improving performance for repeated queries with different values.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,official:true}),
  q(&quot;MS054&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A Cosmos DB application needs products in one known category within a price range, but its current query omits that category predicate and searches every category. Its partition key is categoryId. Which change targets the required partition?&quot;,[&quot;Remove the ORDER BY clause from the query&quot;,&quot;Increase the container&#x27;s provisioned throughput&quot;,&quot;Add the partition key (categoryId) to the WHERE clause to enable single-partition routing&quot;],2,&quot;Include equality on the required categoryId, or supply the partition key in SDK options, to target the partition. This is valid because the request is already category-scoped. Arbitrarily adding a category to an all-category search changes its meaning.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-query-container&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-cosmos-db/6-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS055&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A Cosmos DB container stores text-embedding-ada-002 vectors in c.embedding. With path set to /embedding, which vector policy values match this model&#x27;s full-precision output?&quot;,[&quot;Set dataType to float32, dimensions to 1536, and distanceFunction to cosine&quot;,&quot;Set dataType to int8, dimensions to 1024, and distanceFunction to euclidean&quot;,&quot;Set dataType to float16, dimensions to 3072, and distanceFunction to dotproduct&quot;],0,&quot;Set path to /embedding, dimensions to 1536, and dataType to float32 for full precision. Cosine is valid. Unit-normalized vectors can also give equivalent rankings with dot product or Euclidean distance; cosine is not the only mathematically valid metric.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS056&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A Cosmos DB vector search fetches TOP 100, but the UI needs only the first 10-20 ranked matches and there is no 100-candidate reranking requirement. Which change reduces work for this request?&quot;,[&quot;Force brute-force search by setting the third parameter of VectorDistance to true&quot;,&quot;Remove the ORDER BY clause from the query&quot;,&quot;Reduce the TOP N clause to return only 10-20 results&quot;],2,&quot;Request only the matches the UI needs. Reducing TOP can reduce data returned and query work, but changes result count and does not automatically preserve retrieval or reranking requirements. Measure RU cost, latency, and recall.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS057&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A support knowledge base application needs to find documents similar to a user&#x27;s query but only within a specific product category. Which query structure efficiently combines vector search with metadata filtering?&quot;,[&quot;Execute a cross-partition vector search first, then filter results by category in application code&quot;,&quot;Include the category filter in the WHERE clause and specify the partition_key parameter when the category is the partition key&quot;,&quot;Create a separate container for each product category and execute vector searches against the appropriate container&quot;],1,&quot;Combining the filter in the WHERE clause with the partition_key parameter enables single-partition routing. This significantly reduces RU consumption by targeting only the relevant partition instead of scanning all partitions, while the WHERE clause restricts results to the specified category.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,official:true}),
  q(&quot;MS058&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A team needs Cosmos DB to combine vector similarity and keyword relevance into one ranked result set in a single server-side query. Which native approach supports this?&quot;,[&quot;Use ORDER BY RANK RRF with VectorDistance and FullTextScore functions&quot;,&quot;Execute two separate queries and merge results in application code&quot;,&quot;Add keyword terms to the query vector before executing vector search&quot;],0,&quot;ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...)) combines rank positions with the required vector and full-text policies. Application code can also merge separate ranked queries, but that does not meet this single server-side query requirement.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS059&quot;,&quot;data&quot;,&quot;single&quot;,&quot;An application needs to refresh embeddings when source document content changes, without implementing its own polling loop. Which managed integration should start the work?&quot;,[&quot;Schedule a batch job to periodically scan all documents and regenerate embeddings&quot;,&quot;Store a timestamp with each document and query for recently modified documents&quot;,&quot;Use an Azure Functions Cosmos DB trigger to detect changes and regenerate embeddings&quot;],2,&quot;The Functions Cosmos DB trigger monitors the change feed and manages leases and checkpoints. Internally it polls the feed, rather than receiving a push notification. If writing embeddings back to the source container, detect content changes or separate output storage to avoid an update-trigger loop.&quot;,&quot;https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-cosmosdb-v2-trigger&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-cosmos-db/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS060&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A Cosmos DB query uses WHERE c.documentType = @type ORDER BY c.documentType ASC, c.uploadDate DESC. Which composite index matches this query?&quot;,[&quot;Create a composite index with documentType (ascending) followed by uploadDate (descending)&quot;,&quot;Create separate range indexes on documentType and uploadDate&quot;,&quot;Create a composite index with uploadDate (descending) followed by documentType (ascending)&quot;],0,&quot;Match ORDER BY property sequence and directions: documentType ascending, then uploadDate descending. Include the equality-filter property first in ORDER BY to enable this composite-index pattern while preserving date order within the chosen type.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS061&quot;,&quot;data&quot;,&quot;single&quot;,&quot;An AI application stores 500,000 embeddings per partition and needs to perform fast similarity searches with acceptable accuracy trade-offs. Which vector index type is most appropriate?&quot;,[&quot;flat&quot;,&quot;diskANN&quot;,&quot;quantizedFlat&quot;],1,&quot;DiskANN is recommended for large datasets with more than 50,000 vectors per partition. It provides the lowest latency and RU cost while maintaining high accuracy. This index type is designed for production AI applications at scale.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,official:true}),
  q(&quot;MS062&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A team discovers that embedding arrays are consuming significant storage space. The embeddings are used only for vector similarity searches. How should they modify the indexing policy to reduce storage costs?&quot;,[&quot;Set indexingMode to none to disable all indexing on the container&quot;,&quot;Change the embedding data type from float32 to float16 in the range index&quot;,&quot;Exclude the embedding path from includedPaths and add a vector index for the embedding property&quot;],2,&quot;Embedding arrays don&#x27;t benefit from range indexes. They&#x27;re used only with vector indexes for similarity searches. Excluding the embedding path from range indexing while maintaining a vector index reduces storage costs substantially without affecting vector search capability.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,official:true}),
  q(&quot;MS063&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A document search application queries by category and date range, but users report that recently uploaded documents don&#x27;t appear in search results. The account uses eventual consistency by default. What change would ensure users see their own uploads immediately?&quot;,[&quot;Change the account default to strong for every operation, even though only read-your-writes is required&quot;,&quot;Change the account default from eventual to session, and retain or pass the relevant session token to subsequent reads&quot;,&quot;Increase provisioned throughput to guarantee immediate replication&quot;],1,&quot;First strengthen the account default to at least session. SDK/request overrides can only relax the configured consistency level, not strengthen an eventual account. Reuse the SDK client or propagate the write session token across instances for read-your-writes.&quot;,&quot;https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS064&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Query metrics show that a frequently executed query has low index utilization and high retrieved-to-output document ratios. What does this indicate and how should the developer respond?&quot;,[&quot;The query is performing scans instead of using indexes efficiently. Analyze the query to identify which properties need indexes and add appropriate range or composite indexes.&quot;,&quot;The container has too many indexes. Remove indexes to reduce query overhead and improve index utilization metrics.&quot;,&quot;The query is returning too many results. Add a TOP clause to limit results and improve the retrieved-to-output ratio.&quot;],0,&quot;Low index utilization means the query isn&#x27;t using available indexes effectively, causing it to scan and retrieve more documents than necessary. Analyzing the query&#x27;s filter and sort properties reveals which indexes would improve performance.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-query-performance-azure-cosmos-db/8-knowledge-check&quot;,official:true}),
  q(&quot;MS065&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Your AI application needs to store conversation metadata with varying structures. Some conversations include custom fields like model configuration, while others have user preferences. Which PostgreSQL data type best supports this requirement?&quot;,[&quot;TEXT&quot;,&quot;JSONB&quot;,&quot;VARCHAR(MAX)&quot;],1,&quot;JSONB stores JSON data in a binary format that supports indexing and efficient querying. It&#x27;s ideal when data structure varies between records and you need to query or filter based on nested values.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS066&quot;,&quot;data&quot;,&quot;single&quot;,&quot;You insert a new conversation record and need the auto-generated ID immediately to insert related messages. Which PostgreSQL clause retrieves the generated value without a separate query?&quot;,[&quot;RETURNING&quot;,&quot;OUTPUT&quot;,&quot;SELECT LAST_INSERT_ID()&quot;],0,&quot;The RETURNING clause retrieves values from inserted, updated, or deleted rows in a single round trip. This is essential for getting auto-generated IDs without a separate SELECT query.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS067&quot;,&quot;data&quot;,&quot;single&quot;,&quot;You need to insert a user preference record. If the record already exists, you want to update the value without creating a duplicate. Which PostgreSQL clause handles this scenario?&quot;,[&quot;`INSERT INTO table ON DUPLICATE KEY UPDATE`&quot;,&quot;`INSERT INTO table ON CONFLICT DO UPDATE`&quot;,&quot;`INSERT INTO table IF NOT EXISTS`&quot;],1,&quot;`ON CONFLICT DO UPDATE` handles unique constraint violations by updating the existing row instead of inserting a duplicate. Use `EXCLUDED` to reference the attempted insert values.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS068&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Your Python application creates many short-lived database connections to store individual messages during AI inference. What approach should you use to improve performance?&quot;,[&quot;Open a new connection for each message and close it immediately after&quot;,&quot;Use a ConnectionPool to maintain reusable connections that the application can borrow and return&quot;,&quot;Keep a single global connection open for the entire application lifetime&quot;],1,&quot;Connection pools maintain pre-established connections that your application can reuse. This eliminates the overhead of creating new connections for each operation, significantly improving throughput.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS069&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A PostgreSQL task table has a NOT NULL status column. Which CHECK constraint limits values to pending, in_progress, completed, or failed?&quot;,[&quot;`UNIQUE (status)`&quot;,&quot;`CHECK (status IN (&#x27;pending&#x27;, &#x27;in_progress&#x27;, &#x27;completed&#x27;, &#x27;failed&#x27;))`&quot;,&quot;`NOT NULL DEFAULT &#x27;pending&#x27;`&quot;],1,&quot;CHECK validates the allowed values. NOT NULL is separately required to reject missing status values; a CHECK alone can allow NULL because an unknown check result satisfies the constraint.&quot;,&quot;https://www.postgresql.org/docs/current/ddl-constraints.html&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-query-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS070&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A pgvector query explicitly requires cosine distance. Which operator computes this metric?&quot;,[&quot;`&lt;=&gt;` (cosine distance)&quot;,&quot;`&lt;-&gt;` (L2 distance)&quot;,&quot;`&lt;#&gt;` (negative inner product)&quot;],0,&quot;The &lt;=&gt; operator computes cosine distance. For unit-normalized vectors, cosine, L2, and inner-product rankings are equivalent. Normalization alone does not make &lt;=&gt; the only correct operator; pgvector recommends inner product for performance with normalized vectors.&quot;,&quot;https://github.com/pgvector/pgvector&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS071&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A RAG pipeline has 5 million representative embeddings already loaded. Lower index build time and memory use take priority over HNSW&#x27;s query speed-recall advantage, and lists/probes can be tuned. Which index is the better starting point?&quot;,[&quot;IVFFlat with an appropriate number of lists&quot;,&quot;HNSW with high ef_construction value&quot;,&quot;No index, relying on exact sequential scan&quot;],0,&quot;IVFFlat builds faster and uses less memory than HNSW, while HNSW generally has a better query speed-recall trade-off. Build and memory priorities justify IVFFlat here; dataset size or static data alone do not determine the best index. Benchmark representative data.&quot;,&quot;https://github.com/pgvector/pgvector&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS072&quot;,&quot;data&quot;,&quot;single&quot;,&quot;When creating an HNSW index, what does the `m` parameter control?&quot;,[&quot;The maximum number of connections per node in the graph&quot;,&quot;The number of candidate neighbors considered during index construction&quot;,&quot;The number of lists to partition vectors into&quot;],0,&quot;Correct. The `m` parameter sets the maximum number of bidirectional connections each node maintains to other nodes in the HNSW graph. Higher values create a more connected graph, improving recall at the cost of increased memory usage and longer index build times.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS073&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A PostgreSQL service migrates 50,000 embeddings to a different model while searches continue. Which design keeps each search in one model&#x27;s vector space and limits transaction size?&quot;,[&quot;Populate a separate model-versioned column or table in batches, build its index, then switch retrieval and query embeddings together&quot;,&quot;Overwrite vectors in place in batches while searches compare all rows with one model&#x27;s query vectors&quot;,&quot;Drop the existing index and overwrite all embeddings before adjusting query embedding generation&quot;],0,&quot;Build the new model&#x27;s vectors alongside the old version in bounded transactions. Validate and index them before switching retrieval and query embedding generation together. Batching alone does not make mixing old and new model vectors safe, even when dimensions match.&quot;,&quot;https://github.com/pgvector/pgvector&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS074&quot;,&quot;data&quot;,&quot;single&quot;,&quot;In a hybrid search combining vector similarity with full-text search, what technique helps balance the relevance scores from both search methods?&quot;,[&quot;Using Reciprocal Rank Fusion (RRF) to combine rankings&quot;,&quot;Multiplying the vector distance by the text relevance score&quot;,&quot;Always returning vector search results first&quot;],0,&quot;Correct. Reciprocal Rank Fusion combines results from multiple search methods by computing a score based on each result&#x27;s rank position rather than raw scores. This approach effectively normalizes the different scoring scales used by vector distance and text relevance, producing balanced final rankings.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS075&quot;,&quot;data&quot;,&quot;single&quot;,&quot;A PostgreSQL vector workload has confirmed physical I/O pressure and cache misses. Ample RAM is spare and shared_buffers is below the tested working-set requirement. Which change is a reasonable first experiment?&quot;,[&quot;Increase `shared_buffers` to keep more data in the PostgreSQL cache&quot;,&quot;Decrease `random_page_cost` to encourage more index scans&quot;,&quot;Increase `ivfflat.probes` to search more index partitions&quot;],0,&quot;With confirmed I/O pressure and spare RAM, evaluate increasing shared_buffers within platform limits. A low PostgreSQL buffer hit ratio alone does not prove physical disk reads because the OS cache can serve them. Validate with EXPLAIN (ANALYZE, BUFFERS), I/O metrics, and memory usage.&quot;,&quot;https://www.postgresql.org/docs/current/runtime-config-resource.html&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS076&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Five million embeddings are refreshed daily. Lower index build time is the priority, and the team will benchmark whether a 30-minute maintenance window is achievable. Which configuration is a reasonable initial candidate?&quot;,[&quot;IVFFlat with lists set to sqrt(rows)&quot;,&quot;HNSW with m=16 and ef_construction=64&quot;,&quot;HNSW with m=8 and ef_construction=32&quot;],0,&quot;IVFFlat generally builds faster than HNSW and uses less memory. For over a million rows, pgvector suggests sqrt(rows) as a starting point for lists: about 2236 for five million rows. Tune probes and benchmark recall and build time; no setting alone guarantees a 30-minute build.&quot;,&quot;https://github.com/pgvector/pgvector&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS077&quot;,&quot;data&quot;,&quot;single&quot;,&quot;An exact PostgreSQL vector search has a highly selective category_id predicate and no approximate vector index. EXPLAIN shows a sequential scan. Which supporting index should you check first?&quot;,[&quot;Verify that a B-tree index exists on the `category_id` column&quot;,&quot;Verify that the vector index uses the same operator class as the query&quot;,&quot;Increase `hnsw.ef_search` to expand the search space&quot;],0,&quot;A selective B-tree index can reduce candidates for exact search depending on planner costs. With an ANN vector index, filtering can occur after its scan; a B-tree does not guarantee ANN prefiltering. Inspect plans and consider iterative scans, partial indexes, or partitioning for ANN.&quot;,&quot;https://github.com/pgvector/pgvector&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS078&quot;,&quot;data&quot;,&quot;single&quot;,&quot;You&#x27;re implementing connection management for an AI application that makes 500 vector queries per second during peak traffic. Your Azure Database for PostgreSQL instance supports 1,719 max connections. Which approach should you use?&quot;,[&quot;Enable PgBouncer in transaction mode with a pool size appropriate for your application instances&quot;,&quot;Create a new database connection for each query request&quot;,&quot;Enable PgBouncer in session mode to maintain persistent connections&quot;],0,&quot;Correct. PgBouncer in transaction mode multiplexes many client connections across fewer database connections. Clients hold server connections only during transactions, allowing hundreds of concurrent requests to share a smaller pool. This prevents hitting connection limits while maintaining throughput.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS079&quot;,&quot;data&quot;,&quot;single&quot;,&quot;You&#x27;re scaling a recommendation engine that currently runs on a General Purpose 8 vCore instance. CPU utilization averages 75% and P95 query latency is 150 ms, but you need to achieve sub-50ms latency. What scaling approach should you try first?&quot;,[&quot;Upgrade to a Memory Optimized tier with more vCores&quot;,&quot;Add read replicas to distribute query load&quot;,&quot;Implement application-level caching with Azure Cache for Redis&quot;],0,&quot;Correct. High CPU utilization (75%) combined with slow queries suggests compute constraints. Memory Optimized tiers provide more memory per vCore, which helps keep vector indexes cached. More vCores enable parallel query execution. Vertical scaling is simpler to implement and should be tried before adding architectural complexity.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/optimize-vector-search-azure-database-postgresql/8-knowledge-check&quot;,official:true}),
  q(&quot;MS080&quot;,&quot;data&quot;,&quot;single&quot;,&quot;What is the default TLS connection port for Azure Managed Redis?&quot;,[&quot;10000&quot;,&quot;6379&quot;,&quot;6380&quot;],0,&quot;Azure Managed Redis uses port 10000 as the default connection port for TLS connections.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS081&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which Redis command should you avoid using in production environments for iterating over keys?&quot;,[&quot;KEYS&quot;,&quot;SCAN&quot;,&quot;EXISTS&quot;],0,&quot;The KEYS command should be avoided in production because it blocks the server while scanning all keys. Use SCAN instead for non-blocking iteration.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS082&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which of these redis-py calls atomically stores a value with a 60-second expiration?&quot;,[&quot;setex(&#x27;key&#x27;, 60, &#x27;value&#x27;)&quot;,&quot;expire(&#x27;key&#x27;, 60)&quot;,&quot;set(&#x27;key&#x27;, &#x27;value&#x27;)&quot;],0,&quot;setex sets value and expiration atomically. set(&#x27;key&#x27;, &#x27;value&#x27;, ex=60) is another valid atomic option. The listed set call omits expiration, so only setex meets the requirement among these exact calls.&quot;,&quot;https://redis.io/docs/latest/commands/set/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,official:true,adapted:true}),
