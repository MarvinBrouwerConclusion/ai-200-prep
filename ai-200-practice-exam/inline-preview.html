  q(&quot;MS083&quot;,&quot;data&quot;,&quot;single&quot;,&quot;What does a TTL value of -1 indicate when checking key expiration in Redis?&quot;,[&quot;Key exists but has no expiration set&quot;,&quot;Key doesn&#x27;t exist&quot;,&quot;Key expired 1 second ago&quot;],0,&quot;A TTL value of -1 means the key exists in Redis but has no expiration time set, so it persists indefinitely.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-data-operations-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS084&quot;,&quot;data&quot;,&quot;single&quot;,&quot;What is the key difference between Redis pub/sub and Redis Streams for event messaging?&quot;,[&quot;Pub/sub delivers messages to active subscribers only, while Streams persist messages for consumer groups to process at their own pace&quot;,&quot;Pub/sub can handle more messages per second than Streams&quot;,&quot;Streams are only for string data while pub/sub works with any data type&quot;],0,&quot;Pub/sub is fire-and-forget with no persistence. Streams store messages durably and allow multiple consumer groups to read at different speeds.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS085&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Workers need retained Redis work items, consumer-group coordination, acknowledgements, and crash recovery. Which design provides these capabilities?&quot;,[&quot;Streams with consumer groups, XACK, and application-driven recovery using XAUTOCLAIM or XCLAIM&quot;,&quot;Pub/Sub alone for durable work distribution&quot;,&quot;A List consumed only with LPUSH and RPOP&quot;],0,&quot;Streams track unacknowledged entries in a pending entries list. Consumers acknowledge with XACK and explicitly implement recovery, for example with XAUTOCLAIM. Consumer groups alone do not automatically retry failed work. Configure persistence and retention and make processing idempotent.&quot;,&quot;https://redis.io/docs/latest/commands/xautoclaim/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS086&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which Redis command is used to add a new message to a Stream?&quot;,[&quot;XADD&quot;,&quot;LPUSH&quot;,&quot;PUBLISH&quot;],0,&quot;XADD adds a new message to a Stream with auto-generated or specified IDs. It&#x27;s the fundamental command for putting work items into a Stream queue.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS087&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which scenario is best suited for Redis pub/sub messaging?&quot;,[&quot;Broadcasting real-time status updates to multiple connected clients or services that are currently listening&quot;,&quot;Storing messages that arrive when subscribers are offline and delivering them when subscribers reconnect&quot;,&quot;Implementing a reliable work queue where tasks must be processed exactly once&quot;],0,&quot;Pub/sub excels at one-to-many broadcasting to active subscribers. Perfect for notifications, dashboards, and real-time alerts where subscribers are always connected.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS088&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which Redis pattern distributes new Stream entries among competing workers in one group and tracks unacknowledged deliveries?&quot;,[&quot;XREADGROUP with &gt; in one consumer group, then XACK after successful processing&quot;,&quot;Independent XREAD calls in every worker without group coordination&quot;,&quot;Pub/Sub with a separate channel per worker&quot;],0,&quot;XREADGROUP with &gt; distributes new entries and records pending deliveries. Recover abandoned entries explicitly through claiming. Ownership does not guarantee exactly-once processing or stop an old worker after a claim; use idempotency and fencing or application coordination if strict exclusion is required.&quot;,&quot;https://redis.io/docs/latest/commands/xreadgroup/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-event-messaging-azure-managed-redis/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS089&quot;,&quot;data&quot;,&quot;single&quot;,&quot;An embedding model&#x27;s documented retrieval metric is cosine similarity. Which Redis vector-index distance metric matches that requirement?&quot;,[&quot;COSINE&quot;,&quot;L2 (Euclidean)&quot;,&quot;IP (Inner Product)&quot;],0,&quot;Use COSINE when specified by the model or retrieval design. No one metric is correct for every text embedding model. Unit-normalized embeddings may yield equivalent cosine, L2, and inner-product rankings; select and validate the metric for the model.&quot;,&quot;https://redis.io/docs/latest/develop/ai/search-and-query/vectors/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS090&quot;,&quot;data&quot;,&quot;single&quot;,&quot;When should you evaluate HNSW over FLAT for Redis vector search?&quot;,[&quot;For a large dataset requiring faster queries while accepting a measured and tuned recall trade-off&quot;,&quot;When every query needs guaranteed exact nearest neighbors&quot;,&quot;Only when there are fewer than 1000 vectors&quot;],0,&quot;HNSW trades recall for speed and memory use. Recall depends on data and settings, including EF_RUNTIME. Selecting HNSW does not guarantee a fixed 95-99% accuracy.&quot;,&quot;https://redis.io/docs/latest/develop/ai/search-and-query/vectors/&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,official:true,adapted:true}),
  q(&quot;MS091&quot;,&quot;data&quot;,&quot;single&quot;,&quot;Which data type should you use for vector storage in most AI applications?&quot;,[&quot;FLOAT32&quot;,&quot;FLOAT64&quot;,&quot;INT32&quot;],0,&quot;FLOAT32 balances precision with memory efficiency and works with all major embedding models, making it the standard choice.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS092&quot;,&quot;data&quot;,&quot;single&quot;,&quot;When should you use Redis Hash instead of JSON for storing vectors?&quot;,[&quot;When you have flat data models and need maximum memory efficiency and query performance&quot;,&quot;When your data has nested structures or multiple vectors per document&quot;,&quot;When you need JSON query capabilities&quot;],0,&quot;Hash stores vectors as binary blobs with minimal overhead, providing the best performance and memory usage for simple, flat data.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS093&quot;,&quot;data&quot;,&quot;single&quot;,&quot;What does the EF_RUNTIME parameter control in HNSW queries?&quot;,[&quot;The tradeoff between query speed and accuracy by controlling how many graph nodes are examined&quot;,&quot;The maximum number of results returned by the query&quot;,&quot;The distance metric used for similarity calculations&quot;],0,&quot;Higher EF_RUNTIME values improve accuracy by exploring more of the graph, but slow down queries. Lower values are faster but less accurate.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/implement-vector-storage-azure-managed-redis/6-module-assessment&quot;,official:true}),
  q(&quot;MS094&quot;,&quot;services&quot;,&quot;single&quot;,&quot;Your AI inference function experiences cold start latency of several seconds because it loads large ML libraries and initializes connections to Azure AI services. You need to reduce latency for the first request while keeping costs low during idle periods. Which approach should you use?&quot;,[&quot;Use the Flex Consumption plan with always-ready instances configured for the function&quot;,&quot;Use the Consumption plan with increased function timeout settings&quot;,&quot;Use the Premium plan with pre-warmed workers disabled&quot;],0,&quot;Correct. The Flex Consumption plan&#x27;s always-ready feature lets you keep a minimum number of warm instances for latency-sensitive functions while other functions scale to zero. This provides cold start mitigation for critical endpoints without paying for always-on infrastructure across the entire app.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,official:true}),
  q(&quot;MS095&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You&#x27;re setting up a local development environment for Azure Functions. Your function app uses a Service Bus queue trigger, but you notice the trigger doesn&#x27;t fire when you run the function locally. What is the most likely cause?&quot;,[&quot;The AzureWebJobsStorage setting in local.settings.json isn&#x27;t configured with a valid storage connection&quot;,&quot;The function app needs to be deployed to Azure before Service Bus triggers can be tested&quot;,&quot;Visual Studio Code doesn&#x27;t support debugging Service Bus-triggered functions&quot;],0,&quot;Correct. The Azure Functions runtime requires a storage account connection (AzureWebJobsStorage) to manage internal operations such as trigger coordination and state tracking. Without a valid connection to Azure Storage or the Azurite emulator, non-HTTP triggers like Service Bus triggers don&#x27;t work locally.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,official:true}),
  q(&quot;MS096&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A single-core Function App has a non-session, non-batched Service Bus trigger with dynamic concurrency disabled. It must run at most one callback at a time per instance. Which host.json setting should it use?&quot;,[&quot;Set maxConcurrentCalls to 1 in the serviceBus section of host.json&quot;,&quot;Set batchSize to 1 in the serviceBus section of host.json&quot;,&quot;Set maxDequeueCount to 1 on the Service Bus queue resource&quot;],0,&quot;Set extensions.serviceBus.maxConcurrentCalls to 1 for fixed concurrency in this single-core scenario. On multi-core instances its effective maximum is multiplied by core count. Dynamic concurrency can override fixed settings; session and batch triggers have different controls.&quot;,&quot;https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS097&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You need to store an API key for an Azure AI service in your function app&#x27;s configuration. The security team requires that the key be stored in Azure Key Vault and rotated regularly without requiring application redeployment. Which approach meets these requirements?&quot;,[&quot;Create a Key Vault reference in the application setting using a versionless secret URI&quot;,&quot;Create a Key Vault reference in the application setting using a versioned secret URI&quot;,&quot;Store the API key directly in the application setting with encryption enabled&quot;],0,&quot;Correct. Key Vault references with versionless URIs automatically resolve to the latest secret version. The runtime re-resolves references periodically (within 24 hours) or immediately when any configuration change triggers an app restart, allowing rotated secrets to be picked up without redeploying the application.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,official:true}),
  q(&quot;MS098&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A Function App has a system-assigned identity and ServiceBusConnection__fullyQualifiedNamespace set, but lacks receive permission. Which listed role grants the least privilege required to receive messages?&quot;,[&quot;Azure Service Bus Data Receiver on the Service Bus namespace&quot;,&quot;Azure Service Bus Data Owner on the Service Bus namespace&quot;,&quot;Key Vault Secrets User on the Service Bus namespace&quot;],0,&quot;Data Receiver grants receive access and is narrower than Data Owner, which would also work but grants extra permissions. Assign at the appropriate entity or namespace scope. Trigger scaling can require additional permissions depending on the scaling mechanism.&quot;,&quot;https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-service-bus-trigger&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/build-backends-azure-functions/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS099&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You&#x27;re building an AI content moderation application. You need to emit events when your inference service completes a classification. What type of Event Grid topic should you use to publish these events?&quot;,[&quot;A custom topic&quot;,&quot;A system topic&quot;,&quot;An Event Hubs topic&quot;],0,&quot;Custom topics are user-defined endpoints where your applications post events. Since the inference service is your application code (not an Azure service), you create a custom topic to publish application-level events like inference completion.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,official:true}),
  q(&quot;MS100&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You&#x27;re designing custom events for an AI pipeline and want to enable subscribers to filter events based on which pipeline stage produced them. Which CloudEvents attribute is best suited for path-based filtering with prefix and suffix matches?&quot;,[&quot;The `subject` attribute&quot;,&quot;The `type` attribute&quot;,&quot;The `source` attribute&quot;],0,&quot;The subject attribute provides a path for filtering. You can set it to a hierarchical value like `/pipelines/embeddings/batch-42` and use `subjectBeginsWith` or `subjectEndsWith` filters on subscriptions to route events based on pipeline stage or other path components.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,official:true}),
  q(&quot;MS101&quot;,&quot;services&quot;,&quot;single&quot;,&quot;Your AI handler endpoint occasionally experiences cold-start latency that exceeds 30 seconds. You want to ensure events are still delivered successfully after the handler warms up. What should you do?&quot;,[&quot;Rely on Event Grid&#x27;s automatic retry mechanism with exponential backoff&quot;,&quot;Configure a dead-letter destination to capture timed-out events&quot;,&quot;Set the event time-to-live to 30 seconds to match the timeout&quot;],0,&quot;Event Grid automatically retries failed deliveries using exponential backoff when an endpoint doesn&#x27;t respond within 30 seconds or returns a transient error. The retry schedule starts at 10 seconds and scales up to 24 hours, giving your handler time to recover from cold starts.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,official:true}),
  q(&quot;MS102&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You need to route AI moderation events to different handlers based on whether the content was flagged for review. The flagged status is stored in the `data.status` field of the event payload. Which filtering approach should you use?&quot;,[&quot;Advanced filtering with the `StringIn` operator on `data.status`&quot;,&quot;Event type filtering with `--included-event-types`&quot;,&quot;Subject filtering with `--subject-begins-with`&quot;],0,&quot;Advanced filters match on values within the event body using operators like `StringIn`, `NumberGreaterThan`, and `BoolEquals`. You can create a subscription with `--advanced-filter data.status StringIn flagged` to receive only events where the status field equals &#x27;flagged&#x27;.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,official:true}),
  q(&quot;MS103&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You&#x27;re deploying an AI inference service to Azure Functions and need to publish events to an Event Grid custom topic. What authentication approach should you use for production workloads?&quot;,[&quot;Microsoft Entra ID with a managed identity assigned to the function app&quot;,&quot;Access key authentication using the `aeg-sas-key` header&quot;,&quot;Store the access key in the function app&#x27;s application settings&quot;],0,&quot;Microsoft Entra ID authentication is recommended for production because it eliminates the need to manage and rotate shared secrets. You assign a managed identity to the function app and grant it the Event Grid Data Sender role on the custom topic.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/event-driven-workflows-event-grid/7-knowledge-check&quot;,official:true}),
  q(&quot;MS104&quot;,&quot;services&quot;,&quot;single&quot;,&quot;An orchestrator directly calls a model endpoint and branches on the response. The orchestration later fails during replay because the model returns a different result. How should you redesign the workflow?&quot;,[&quot;Move the model call to an activity function and branch on the recorded activity result in the orchestrator&quot;,&quot;Keep the model call in the orchestrator and replace the endpoint with a synchronous deployment&quot;,&quot;Keep the model call in the orchestrator and use context.current_utc_datetime before each request&quot;],0,&quot;Correct. Activity functions perform nondeterministic input/output operations. Durable Functions records the activity result, so the orchestrator can replay the same deterministic branch.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,official:true}),
  q(&quot;MS105&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A workflow processes thousands of independent documents, but the model deployment has limited request capacity. Which fan-out/fan-in design best protects the dependency while preserving parallel processing?&quot;,[&quot;Yield each activity immediately so the orchestrator processes every document sequentially&quot;,&quot;Divide the documents into bounded batches and use context.task_all() for each batch before scheduling the next one&quot;,&quot;Schedule every activity at once and rely on the orchestration history to enforce the model rate limit&quot;],1,&quot;Correct. Bounded batches preserve parallel work within each group while limiting the number of activities scheduled at once. You select the batch size from observed function and downstream capacity.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,official:true}),
  q(&quot;MS106&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A document workflow must wait up to 24 hours for an adjuster&#x27;s decision without holding compute resources. Which orchestration pattern should you use?&quot;,[&quot;Call time.sleep() in the orchestrator and check the approval database after the delay&quot;,&quot;Call an approval activity with a 24-hour client request timeout&quot;,&quot;Race wait_for_external_event() against a durable timer with context.task_any() and cancel the pending timer when the event wins&quot;],2,&quot;Correct. The external event resumes the orchestration when a decision arrives, while the durable timer defines the deadline without holding a worker. Canceling the losing timer lets the orchestration finish cleanly.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,official:true}),
  q(&quot;MS107&quot;,&quot;services&quot;,&quot;single&quot;,&quot;An activity writes a result blob, but the host restarts before Durable Functions records the activity completion. The activity runs again. Which design prevents a duplicate result?&quot;,[&quot;Use a stable operation ID as the blob name, create the blob without overwrite, and return the existing result when the blob already exists&quot;,&quot;Generate a new UUID inside the activity for each write so every retry has a unique blob name&quot;,&quot;Enable orchestrator replay logging so Durable Functions suppresses the second blob write&quot;],0,&quot;Correct. Durable Functions provides at-least-once activity execution, so stable operation keys and conditional writes make repeated execution produce the same business result.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,official:true}),
  q(&quot;MS108&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A document activity exhausts its bounded retries after a transient dependency failure, and an earlier step already created provisional external state. How should the orchestration handle the failure?&quot;,[&quot;Return a Completed status after logging the error so the batch can continue&quot;,&quot;Schedule an idempotent compensation activity for completed side effects, then rethrow the original failure&quot;,&quot;Retry the entire orchestration instance without recording which forward operations completed&quot;],1,&quot;Correct. Compensation applies a new business action to address completed external work. Rethrowing preserves the failed orchestration status instead of presenting compensation as normal success.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/orchestrate-durable-functions/7-knowledge-check&quot;,official:true}),
  q(&quot;MS109&quot;,&quot;services&quot;,&quot;single&quot;,&quot;Your AI platform completes a document analysis, and three independent services need to react to the result: a notification service alerts the user, an audit service logs the result for compliance, and a dashboard service updates metrics. Which Service Bus entity type supports this requirement?&quot;,[&quot;A topic with three subscriptions&quot;,&quot;A queue with three competing consumers&quot;,&quot;Three separate queues with the sender publishing to each one&quot;],0,&quot;A topic distributes copies of each message to all attached subscriptions. Each subscription acts as an independent virtual queue, so the notification, audit, and dashboard services each receive and process their own copy of the message independently.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,official:true}),
  q(&quot;MS110&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You&#x27;re building an AI inference pipeline where losing a customer&#x27;s request is unacceptable. If a worker crashes while processing a message, the message must become available to another worker. Which receive mode should you configure?&quot;,[&quot;Peek-lock mode&quot;,&quot;Receive-and-delete mode&quot;,&quot;Deferred receive mode&quot;],0,&quot;Peek-lock mode locks the message without removing it from the queue. If the worker crashes before settling the message, the lock expires and Service Bus makes the message available for another consumer. This provides at-least-once delivery, which is essential when losing requests isn&#x27;t acceptable.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,official:true}),
  q(&quot;MS111&quot;,&quot;services&quot;,&quot;single&quot;,&quot;A Service Bus queue uses MaxDeliveryCount=10. A poison message fails repeatedly and exhausts the configured delivery limit. What happens?&quot;,[&quot;Moves the message to the dead-letter queue with the reason MaxDeliveryCountExceeded&quot;,&quot;Deletes the message permanently from the queue&quot;,&quot;Returns the message to the back of the queue for continued retry attempts&quot;],0,&quot;Service Bus moves the message to the DLQ with MaxDeliveryCountExceeded when the configured delivery limit is exhausted. Ten is the default, not a universal fixed retry count. Some lock-loss conditions do not increment delivery count.&quot;,&quot;https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS112&quot;,&quot;services&quot;,&quot;single&quot;,&quot;Your AI pipeline needs to process 500-MB document files, but Azure Service Bus Premium tier supports messages up to 100 MB via AMQP. Which pattern addresses this constraint?&quot;,[&quot;The claim-check pattern, uploading files to Azure Blob Storage and sending only the blob URI in the message&quot;,&quot;Splitting the document into five 100-MB messages and reassembling them at the consumer&quot;,&quot;Encoding the document as base64 and sending it as the message body on the Premium tier&quot;],0,&quot;The claim-check pattern separates the large payload from the message. The producer uploads the file to Azure Blob Storage and sends a small Service Bus message containing only the blob URI. The consumer retrieves the full payload from storage using the URI. This works within any tier&#x27;s size limits and reduces broker throughput costs.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,official:true}),
  q(&quot;MS113&quot;,&quot;services&quot;,&quot;single&quot;,&quot;You set the correlation_id property on every Service Bus message in your AI pipeline. What is the primary purpose of this property?&quot;,[&quot;Tracking a request end-to-end across all pipeline stages, from the API through processing to result delivery&quot;,&quot;Enabling duplicate detection so Service Bus discards repeated submissions of the same request&quot;,&quot;Routing messages to specific subscriptions based on filter rules&quot;],0,&quot;The correlation_id provides end-to-end request tracking. The client generates a unique identifier when submitting the original request, and this ID follows the message through every stage of the pipeline. When troubleshooting a failed inference, you can search logs, dead-letter queues, and result stores by correlation ID to trace the full lifecycle of a request.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/queue-process-operations-service-bus/7-knowledge-check&quot;,official:true}),
  q(&quot;MS114&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Your AI application needs to read secrets from Azure Key Vault at runtime but shouldn&#x27;t be able to create or delete secrets. Which built-in RBAC role should you assign to the application&#x27;s managed identity?&quot;,[&quot;Key Vault Secrets User&quot;,&quot;Key Vault Secrets Officer&quot;,&quot;Key Vault Contributor&quot;],0,&quot;Key Vault Secrets User grants read-only access to secret values, which is the appropriate least-privilege role for applications that retrieve but don&#x27;t manage secrets.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,official:true}),
  q(&quot;MS115&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;You want your application to authenticate with Key Vault using managed identity in production and Azure CLI credentials during local development, without changing code between environments. Which credential class should you use?&quot;,[&quot;ManagedIdentityCredential&quot;,&quot;EnvironmentCredential&quot;,&quot;DefaultAzureCredential&quot;],2,&quot;DefaultAzureCredential chains multiple authentication methods in a defined order, automatically using managed identity on Azure compute resources and Azure CLI credentials in local development environments.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,official:true}),
  q(&quot;MS116&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;You store three versions of a secret named &#x27;cosmosdb-connection-string&#x27; in Key Vault. What does calling get_secret(&#x27;cosmosdb-connection-string&#x27;) without a version parameter return?&quot;,[&quot;The first version created, regardless of newer versions&quot;,&quot;The latest version; retrieval fails if it is disabled instead of falling back to an older enabled version&quot;,&quot;All versions as a list of KeyVaultSecret objects&quot;],1,&quot;Without a version, get_secret requests the latest version. It must be enabled to retrieve its value; Key Vault does not search backward for an older enabled version. Explicitly request a previous version if required.&quot;,&quot;https://learn.microsoft.com/en-us/rest/api/keyvault/secrets/get-secret/get-secret?view=rest-keyvault-secrets-2025-07-01&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS117&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Your AI application connects to a service that supports two active keys simultaneously. You need to rotate the credential without any application downtime. Which rotation strategy should you use?&quot;,[&quot;Dual-credential rotation&quot;,&quot;Manual rotation with application restart&quot;,&quot;Automated rotation with Event Grid only&quot;],0,&quot;Dual-credential rotation generates a new secondary key, stores it in Key Vault, waits for all application instances to pick up the new value, then regenerates the old key. At least one valid credential always exists, preventing downtime.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,official:true}),
  q(&quot;MS118&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;An API handles 500 requests per second using a Key Vault secret rotated every 90 days. The issuing service keeps the old credential valid for more than an hour during rotation. Which listed cache design reduces vault calls while permitting periodic refresh?&quot;,[&quot;No caching with direct Key Vault calls per request&quot;,&quot;Time-based in-memory cache with a one-hour TTL&quot;,&quot;Startup preloading with no periodic refresh&quot;],1,&quot;A one-hour in-memory TTL cache reduces vault reads and permits refresh within the stated credential overlap. The rotation interval alone does not establish a safe staleness window. Handle authentication failures with refresh where appropriate, and design invalidation for urgent revocation.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-secrets-key-vault/7-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS119&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A developer loads App Configuration settings with two `SettingSelector` entries: one for the null label and one for the `Production` label. The key `Pipeline:BatchSize` exists with both labels. Which value does the application use?&quot;,[&quot;The value from the null label because null labels always take priority as defaults.&quot;,&quot;The value from the `Production` label because it&#x27;s loaded second and overrides the null-labeled value for the same key.&quot;,&quot;The provider raises an error because the same key can&#x27;t exist with multiple labels in a single load operation.&quot;],1,&quot;The provider applies `SettingSelector` entries in order. Later selectors override earlier ones for matching keys. Since the `Production` label selector appears after the null label selector, its value for `Pipeline:BatchSize` takes priority. This stacking behavior is the foundation for environment-specific overrides.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,official:true}),
  q(&quot;MS120&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;What does Azure App Configuration store when you create a Key Vault reference for a secret?&quot;,[&quot;An encrypted copy of the secret value from Key Vault.&quot;,&quot;A shared access signature (SAS) token that grants temporary access to the secret in Key Vault.&quot;,&quot;A URI that points to the secret in Azure Key Vault, along with reference metadata and a specific content type.&quot;],2,&quot;A Key Vault reference stores the vault URI, secret name, and optional version with a content type of `application/vnd.microsoft.appconfig.keyvaultref+json;charset=utf-8`. The provider recognizes this content type and resolves the actual secret value from Key Vault automatically. App Configuration never stores the secret value itself.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,official:true}),
  q(&quot;MS121&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A developer building an AI document processing pipeline needs to store the Azure OpenAI model deployment name (`gpt-4o`). Where should this setting be stored?&quot;,[&quot;Azure Key Vault because all Azure OpenAI-related settings should be stored together with the API key for organizational consistency.&quot;,&quot;Azure App Configuration as a regular key-value pair because the deployment name is nonsensitive and doesn&#x27;t grant access to any resource.&quot;,&quot;Azure App Configuration as a Key Vault reference because the setting is related to a service that also has secrets.&quot;],1,&quot;Model deployment names control application behavior but don&#x27;t grant access to resources. They&#x27;re nonsensitive settings that belong in App Configuration, where they benefit from labels for environment differentiation, feature flags, and dynamic refresh. Only values that grant access, like API keys, belong in Key Vault.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,official:true}),
  q(&quot;MS122&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Which two Azure RBAC role assignments does an application&#x27;s managed identity need to resolve Key Vault references from App Configuration?&quot;,[&quot;App Configuration Data Reader on the App Configuration store and Key Vault Secrets User on the Key Vault.&quot;,&quot;App Configuration Data Owner on the App Configuration store and Key Vault Administrator on the Key Vault.&quot;,&quot;Key Vault Secrets User on both the App Configuration store and the Key Vault.&quot;],0,&quot;The application needs App Configuration Data Reader to retrieve settings and references from the store, and Key Vault Secrets User to read the secret values that references point to. These two roles follow the principle of least privilege by granting read-only access to both services.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,official:true}),
  q(&quot;MS123&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A developer enables dynamic configuration refresh with a sentinel key and a 60-second refresh interval. What must happen for the application to pick up configuration changes from the store?&quot;,[&quot;The provider automatically pushes updated values to the application whenever any key changes in the store.&quot;,&quot;The application must restart to load the latest configuration because the provider caches all values at the initial `load()` call.&quot;,&quot;The application must call the `refresh()` method on the configuration object, and the sentinel key must have changed since the last refresh check.&quot;],2,&quot;Dynamic refresh requires two conditions: the application calls `refresh()` explicitly (typically in a request handler or loop), and the sentinel key was updated to signal that new configuration values are available. If the refresh interval hasn&#x27;t elapsed, the `refresh()` call returns immediately without contacting the store.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/manage-app-settings-app-config/7-knowledge-check&quot;,official:true}),
  q(&quot;MS124&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Application Insights keeps sampled exception records whose itemCount represents their sampling weight. Which KQL aggregation produces a sampling-adjusted estimate of total exceptions?&quot;,[&quot;`sum(itemCount)`&quot;,&quot;`count()`&quot;,&quot;`dcount(type)`&quot;],0,&quot;sum(itemCount) weights retained records to estimate original event count. count() counts only retained records. Sampling introduces estimation error; the adjusted sum is not guaranteed to be the exact original count.&quot;,&quot;https://learn.microsoft.com/en-us/azure/azure-monitor/app/sampling-classic-api&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS125&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A developer needs to trace the full chain of events from a single user request as it flows through four services in a document processing pipeline. Which Application Insights column links all telemetry items from that single distributed request?&quot;,[&quot;`cloud_RoleName`&quot;,&quot;`operation_Id`&quot;,&quot;`customDimensions`&quot;],1,&quot;The `operation_Id` column is shared across all telemetry items that belong to a single distributed trace, making it possible to correlate requests, dependencies, exceptions, and traces from the same user request as it flows through multiple services.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,official:true}),
  q(&quot;MS126&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;During an incident, a team member confirms elevated error rates on a dashboard and needs to investigate the root cause by dynamically filtering telemetry by service, time window, and error type. Which Azure Monitor tool is designed for this interactive investigation?&quot;,[&quot;Azure dashboards&quot;,&quot;Azure Monitor metric alerts&quot;,&quot;Azure Monitor Workbooks&quot;],2,&quot;Workbooks provide an interactive canvas with parameters, conditional visibility, and linked grids that let users adjust filters and drill into specific data points. This interactivity makes workbooks the right choice for troubleshooting and root cause analysis.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,official:true}),
  q(&quot;MS127&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A developer creates a log search alert with a KQL query that counts failed requests per service and returns rows only for services exceeding ten failures. The threshold is set to greater than zero table rows. What behavior does this configuration produce?&quot;,[&quot;The alert fires whenever any service has more than 10 failures in the evaluation window.&quot;,&quot;The alert fires once for each individual failed request detected in the evaluation window.&quot;,&quot;The alert fires only when all monitored services have more than 10 failures simultaneously.&quot;],0,&quot;The query returns rows only for services that exceed 10 failures. Setting the threshold to greater than zero table rows means the alert fires if the query returns any rows, indicating at least one service crossed the failure threshold in the evaluation window.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,official:true}),
  q(&quot;MS128&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Average response time hides occasional slow requests. Which KQL expression estimates the latency threshold below which 95% of recorded requests fall?&quot;,[&quot;`avg()`&quot;,&quot;`percentile(duration, 95)`&quot;,&quot;`max(duration)`&quot;],1,&quot;percentile(duration, 95) estimates the p95 boundary. Approximately 5% of requests lie above it; it is neither the average nor the maximum latency of those slowest requests.&quot;,&quot;https://learn.microsoft.com/en-us/kusto/query/percentile-aggregation-function&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/analyze-telemetry-logs-metrics/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS129&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;What standard does OpenTelemetry use to propagate trace context across service boundaries?&quot;,[&quot;OpenTracing B3 headers&quot;,&quot;W3C TraceContext using `traceparent` headers&quot;,&quot;OpenCensus binary propagation&quot;],1,&quot;OpenTelemetry uses the W3C TraceContext standard to propagate context through HTTP headers. The `traceparent` header carries the trace ID, parent span ID, and trace flags so receiving services can join the same distributed trace.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,official:true}),
  q(&quot;MS130&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;When you configure the Azure Monitor connection string in a production environment, which approach is recommended?&quot;,[&quot;Embed it directly in source code using the code-based configuration option.&quot;,&quot;Store it in a `config.py` settings file that is deployed alongside the application code.&quot;,&quot;Set the `APPLICATIONINSIGHTS_CONNECTION_STRING` environment variable.&quot;],2,&quot;Set APPLICATIONINSIGHTS_CONNECTION_STRING as environment-specific configuration to separate deployment settings from source code. Its endpoint and instrumentation key identify telemetry ingestion; the connection string is not a secret granting read access to telemetry. Configure Microsoft Entra ingestion authentication separately when required.&quot;,&quot;https://learn.microsoft.com/en-us/azure/azure-monitor/app/connection-strings&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,official:true,adapted:true}),
  q(&quot;MS131&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;When using `tracer.start_as_current_span()` in Python and an unhandled exception propagates out of the `with` block, what does the OpenTelemetry SDK do automatically?&quot;,[&quot;Records the exception on the span and sets the span status to error.&quot;,&quot;Suppresses the exception and marks the span as successful to avoid false alerts.&quot;,&quot;Leaves the span status as unset and doesn&#x27;t record any exception details.&quot;],0,&quot;The Python SDK automatically catches exceptions that propagate out of a `start_as_current_span` context manager, records the exception details, and sets the span status to `StatusCode.ERROR`. This provides automatic error capture without requiring explicit exception handling code.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,official:true}),
  q(&quot;MS132&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;A Python AI application creates a span using `tracer.start_as_current_span(\&quot;CallLlmApi\&quot;, kind=SpanKind.CLIENT)`. In which Application Insights table does this span appear?&quot;,[&quot;`requests`&quot;,&quot;`traces`&quot;,&quot;`dependencies`&quot;],2,&quot;Application Insights maps client spans (`SpanKind.CLIENT`), along with internal and producer spans, to the `dependencies` table. These represent outgoing calls from the service to external resources or APIs, such as calls to an LLM endpoint or embedding service.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,official:true}),
  q(&quot;MS133&quot;,&quot;operations&quot;,&quot;single&quot;,&quot;Which field in Application Insights telemetry tables corresponds to the OpenTelemetry trace ID and enables correlation of all telemetry items in a distributed trace?&quot;,[&quot;`cloud_RoleName`&quot;,&quot;`operation_Id`&quot;,&quot;`id`&quot;],1,&quot;The `operation_Id` field corresponds to the OpenTelemetry trace ID. It appears in the `requests`, `dependencies`, `traces`, and `exceptions` tables and links all telemetry items belonging to the same distributed trace together.&quot;,&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,{practiceSource:&quot;https://learn.microsoft.com/en-us/training/modules/instrument-app-opentelemetry/8-knowledge-check&quot;,official:true}),

// Count case-study and locked questions before selecting the general section.
const EXAM_DOMAIN_COUNTS={containers:12,data:14,services:12,operations:12};
function selectExamQuestions(caseStudy,shuffle){
  const fixed=[...caseStudy.questions,...LOCKED_SET.questions];
  return shuffle(Object.entries(EXAM_DOMAIN_COUNTS).flatMap(([domain,total])=&gt;{
    const count=total-fixed.filter(question=&gt;question.domain===domain).length;
    const candidates=QUESTION_BANK.filter(question=&gt;question.domain===domain);
    if(count&lt;0||count&gt;candidates.length)throw new Error(`Invalid question count for ${domain}`);
    return shuffle(candidates).slice(0,count);
  }));
}

// Randomize choices once per session, preserving answer indexes and source data.
function prepareQuestion(question,shuffle){
  if(question.type!==&quot;single&quot;&amp;&amp;question.type!==&quot;multi&quot;)return {...question};
  const indexes=shuffle(question.options.map((_,index)=&gt;index));
  const remap=index=&gt;indexes.indexOf(index);
  return {...question,options:indexes.map(index=&gt;question.options[index]),
    answer:Array.isArray(question.answer)?question.answer.map(remap):remap(question.answer)};
}
